name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "packages/probnode[dev]" -e "packages/probnode-mcp[dev]"
      - run: ruff check packages examples
      - run: pytest -q packages/probnode/tests packages/probnode-mcp/tests
