name: publish-pypi

# probnode-sdk and probnode-mcp to PyPI by Trusted Publishing (OIDC): no token is stored anywhere.
# probnode-sdk trusts probnode/probnode-sdk + this file + environment `pypi`; probnode-mcp the
# same with environment `pypi-mcp`. Push a tag `pypi-vX.Y.Z` once both pyproject versions say X.Y.Z.

on:
  push:
    tags: ["pypi-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag matches both versions
        if: startsWith(github.ref, 'refs/tags/pypi-v')
        run: |
          want="${GITHUB_REF_NAME#pypi-v}"
          for p in packages/probnode packages/probnode-mcp; do
            have=$(sed -n 's/^version = "\(.*\)"/\1/p' "$p/pyproject.toml")
            [ "$have" = "$want" ] || { echo "$p is $have, the tag says $want"; exit 1; }
          done
      - run: python -m pip install build twine
      - run: |
          python -m build packages/probnode --outdir dist/sdk
          python -m build packages/probnode-mcp --outdir dist/mcp
      - run: python -m twine check dist/sdk/* dist/mcp/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # One job per project, each in its own environment. PyPI picks the trusted publisher by the
  # token claims (repository, workflow, environment); two projects with the same claims get a
  # token for the first one only (403 "OIDC scoped token is not valid for project").
  publish-sdk:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/sdk/
          skip-existing: true

  # probnode-mcp depends on probnode-sdk, so it goes second.
  publish-mcp:
    needs: publish-sdk
    runs-on: ubuntu-latest
    environment: pypi-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist/mcp/
          skip-existing: true
