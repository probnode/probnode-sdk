name: publish-pypi

# probnode-sdk and probnode-mcp to PyPI by Trusted Publishing (OIDC): no token is stored anywhere.
# Each project on pypi.org names probnode/probnode-sdk, this workflow file and the environment `pypi`
# as its trusted publisher. Push a tag `pypi-vX.Y.Z` once both pyproject versions say X.Y.Z.

on:
  push:
    tags: ["pypi-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag matches both versions
        if: startsWith(github.ref, 'refs/tags/pypi-v')
        run: |
          want="${GITHUB_REF_NAME#pypi-v}"
          for p in packages/probnode packages/probnode-mcp; do
            have=$(sed -n 's/^version = "\(.*\)"/\1/p' "$p/pyproject.toml")
            [ "$have" = "$want" ] || { echo "$p is $have, the tag says $want"; exit 1; }
          done
      - run: python -m pip install build twine
      - run: |
          python -m build packages/probnode --outdir dist
          python -m build packages/probnode-mcp --outdir dist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # probnode-mcp depends on probnode-sdk; one upload of both, the SDK listed first.
      - uses: pypa/gh-action-pypi-publish@v1.12.4
        with:
          packages-dir: dist/
