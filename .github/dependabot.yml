version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/packages/probnode", "/packages/probnode-mcp"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
