version: 2
updates:
  - package-ecosystem: "pip"
    directories: ["/packages/probnode", "/packages/probnode-mcp"]
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # A major version is a deliberate upgrade, made by hand with its changes, not a bot bump.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # Its ref is a toolchain version (stable, or the MSRV), not a release of the action.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
