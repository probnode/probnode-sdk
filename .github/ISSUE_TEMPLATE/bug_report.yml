name: Bug report
description: Something in probnode-sdk or probnode-mcp does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste your API key anywhere in this form.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - probnode-sdk (Python client)
        - probnode-sdk (probnode command line)
        - probnode-mcp
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`pip show probnode-sdk probnode-mcp`"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The code or command you ran, and what it printed. Include the full ProbNodeError message if there was one.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Dataset, format, time range or market involved, if relevant.
