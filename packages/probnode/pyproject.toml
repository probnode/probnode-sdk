[project]
name = "probnode-sdk"
version = "0.3.2"
description = "Python client and CLI for ProbNode: Polymarket order books, trades and gaps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    # The lp2 reader decodes the native book format; parquet and csv.gz need nothing extra to
    # download, but reading any of them into a table does.
    "numpy>=1.24",
    "pyarrow>=14",
]

[project.optional-dependencies]
# The published Probe reader (Apache-2.0, github.com/probnode/probe): the same Rust
# implementation as the `probe` CLI. Optional because downloading a file needs nothing extra.
probe = ["probe-format>=0.2"]
# The real-time stream /v2/live (probnode.live).
live = ["websockets>=13"]
pandas = ["pandas>=2.0"]
polars = ["polars>=0.20"]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.urls]
Homepage = "https://probnode.com"
Documentation = "https://probnode.com/docs"
"Live API" = "https://probnode.com/docs/live-api?lang=python"
"Live API client" = "https://probnode.com/docs/live-api/client?lang=python"
Changelog = "https://probnode.com/docs/live-api/release-notes"
Source = "https://github.com/probnode/probnode-sdk"
Issues = "https://github.com/probnode/probnode-sdk/issues"

[project.scripts]
probnode = "probnode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probnode"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
